version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
        # Generate Prisma client from the schema
        - npx prisma generate
    build:
      commands:
        # Inject Amplify environment variables into .env.production for SSR runtime
        - env | grep -E 'DATABASE_URL|APP_|AUTH_SECRET|NEXT_PUBLIC_' >> .env.production
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*